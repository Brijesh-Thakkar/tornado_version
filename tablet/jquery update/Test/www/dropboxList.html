<!DOCTYPE html> 
<html>
<head>
    <link rel="stylesheet"  href="lib/jquery/jquery.mobile-1.4.4.min.css" />
    <script type="text/javascript" src="lib/jquery/jquery-1.11.1.min.js"></script>
    <script type="text/javascript" src="lib/jquery/jquery.mobile-1.4.4.min.js"></script>
</head>
<body> 

<div data-role="page" id="dropboxFileList" data-cache="never" data-scroll='y' data-iscroll='enable'>
	<div id="header" data-role="header" class="ui-bar" data-theme="b" style="padding-bottom:10px;background: #DDDDDD;"> 
	  <div class="ui-grid-b">
	    <div class="ui-block-a">
              <div data-role="button" data-inline="true" class="ui-btn ui-corner-all ui-btn-icon-left ui-icon-home"
		onclick="changePage('#indexPage');">Home</div>
            <div data-role="button" data-inline="true" class="ui-btn ui-corner-all ui-btn-icon-left ui-icon-back"
                onclick=" window.history.back();">Back</div>

	    </div>
            <div class="ui-block-b">
                <div  data-role="button" class="ui-btn ui-corner-all"  onclick="dropboxHandler.saveLocalPage();">Move to iPad</div>

                
            </div>

            <div class="ui-block-c">
               <span id="dropboxFileList-fname" style="vertical-align:middle;position: absolute; right: 40px; top: .4em;"></span>
	    </div>
	  </div>
	</div>

	<div role="main" class="ui-content" id="content">
        <div id="scroll-content">

             <ul data-role="listview" data-theme="d" id="dropboxList1">
              </ul>

            <ul data-role="listview" data-scroll='y' data-theme="d" id="dropboxList" style="display:none">
	      <li class="fieldcontain">
	      <div class="ui-grid-b">
		  <div class="ui-block-a">
              <!--ProtectedImagePlace-->
		  </div>
		
	          <div class="ui-block-b">
		       <span style="vertical-align:middle;position: absolute;top:1.2em;"><h2>!--Template1--<h2></span>
		  </div>
		  <div class="ui-block-c">		
		         <fieldset data-role="controlgroup"
	               data-type="vertical">

		         <button onclick="dropboxHandler.Delete('!--Template2--')">Delete</button>
		         </fieldset>
		   </div>
		   
	      </div>
	      </li>
              </ul>
            </div>

	      
	</div>
    
<div id="footer"></div>
</div>





</body>
</html>
