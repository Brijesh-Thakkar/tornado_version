                    {"numsheets":9,"currentid":"sheet1","currentname":"sheet8","sheetArr":{"sheet1":{"sheetstr":{"savestr":"version:1.5\ncell:C3:t:Introduction:f:4:c:3:bg:1:cf:1:colspan:2\ncell:C6:t:Fitness planner enables you to keep a track of your exercise routine on a monthly and a weekly basis. A meal planner and a monthly calendar sheet of the current month are provided along with the exercise log sheets.:colspan:2\ncell:C7:colspan:2\ncell:C8:t:Popular exercises like running, weight training and swimming have been included. Goals can be set on a daily basis, and can be compared regularly using the log sheets of the exercises. The log sheet also helps summarize and track the goals and actual duration spend per activity on a weekly basis. We are planning to develop the graphs for this analysis in the future releases.:bg:2:colspan:2\ncell:C9:colspan:2\ncell:C10:t:The \"Summary\" sheet provides a comparative analysis between the goals and the actual time spend per activity on a monthly basis for all the activities.:colspan:2\ncell:C11:colspan:2\ncell:C12:t:Weekly Meal Planner sheet maintains a log of the meals planned for the week and organize a grocery list for healthy and cost effective spending on food. :bg:2:colspan:2\ncell:C13:colspan:2\ncell:C14:t:The Monthly Calendar sheet provides a note taking feature to help track the fitness plan on a daily basis for the entire month of June. We plan to update the app on a monthly basis with the replacement of the sheet for the current month with that of the next adjacent month.:colspan:2\ncell:C15:colspan:2\ncell:C16:t:Entering data is simple. Tap on the cell to edit and add the text.:colspan:2\ncell:C18:t:The log and summary sheets of fitness activities contain the following fields\\c:colspan:2\ncell:C20:t:Field Name:f:3:c:3:bg:1:cf:1\ncell:D20:t:Description:f:3:c:3:bg:1:cf:1\ncell:B21:b::1::\ncell:C21:b::1::1\ncell:D21:b::1::1\ncell:E21:b::::1\ncell:B22:b::1::\ncell:C22:t:Total Days:b::1::1\ncell:D22:t:The total days
