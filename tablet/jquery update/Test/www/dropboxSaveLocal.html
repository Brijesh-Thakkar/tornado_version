<!DOCTYPE html> 
<html>
<head>
    <link rel="stylesheet"  href="lib/jquery/jquery.mobile-1.4.4.min.css" />
    <script type="text/javascript" src="lib/jquery/jquery-1.11.1.min.js"></script>
    <script type="text/javascript" src="lib/jquery/jquery.mobile-1.4.4.min.js"></script>
</head>
<body> 

	<div data-role="page" id="dropboxSaveList"  data-cache="never" data-scroll='y' data-iscroll='enable'>
	
            <div data-role="header"  data-theme="b"  class="ui-bar" style="padding-bottom:10px;background: #DDDDDD;">
              <div class="ui-grid-b">
                <div class="ui-block-a">
                  <div data-role="button" data-inline="true" class="ui-btn ui-corner-all ui-btn-icon-left ui-icon-back"
                    onclick="$.mobile.changePage('file.html#filePage');">Back</div>
                </div>
                <div class="ui-block-b">
			<div  data-role="button" class="ui-btn ui-corner-all" align='center' onclick="dropboxHandler.saveLocalMultiple();">
				Save To Device
			</div>			
                </div>
                <div class="ui-block-c"></div>
              </div>
            </div>
    
             <div role="main" class="ui-content">
                <div data-role="fieldcontain" id="dropboxCheckList"></div>                  
            </div>
           
        </div>
</body>
</html>
