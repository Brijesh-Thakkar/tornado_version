<!--
playground to test multiple sheets in a page
-->
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<META http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>TestMultiSheet</title>
<script type="text/javascript" src="{{ static_url("socialcalcconstants.js") }}"></script>
<script type="text/javascript" src="{{ static_url("socialcalc-3.js") }}"></script>
<script type="text/javascript" src="{{ static_url("socialcalctableeditor.js") }}"></script>
<script type="text/javascript" src="{{ static_url("formatnumber2.js") }}"></script>
<script type="text/javascript" src="{{ static_url("formula1.js") }}"></script>
<script type="text/javascript" src="{{ static_url("socialcalcpopup.js") }}"></script>
<script type="text/javascript" src="{{ static_url("socialcalcspreadsheetcontrol.js") }}"></script>
<script type="text/javascript" src="{{ static_url("socialcalcworkbook.js") }}"></script>
<script type="text/javascript" src="{{ static_url("socialcalcworkbookcontrol.js") }}"></script>
<script type="text/javascript" src="{{ static_url("json2.js") }}"></script>
<style>
body, td, input, texarea {font-family:verdana,helvetica,sans-serif;font-size:small;}
.smaller {font-size:smaller;}
</style>
</head>


<body style="background-color:#FFF;" onresize="spreadsheet.DoOnResize();">

<div id="workbookControl" style="background-color:#80A9F3;">
</div>

<div style="margin:8px 0px 10px 0px;">
 <div id="tableeditor" style="margin:8px 0px 10px 0px;">editor goes here</div>
</div>
 <div id="msg" onclick="this.innerHTML='&nbsp;';"></div>

<textarea name="savestr" id="sheetdata" style="display:none;">
{{ entry["sheetstr"] }}
</textarea>


<script>

 SocialCalc.Callbacks.broadcast = function(a,b) {
}

  SocialCalc.Constants.defaultImagePrefix = "{{ static_url("images/sc-") }}";
  SocialCalc.Popup.imagePrefix = "{{ static_url("images/sc-") }}";

var spreadsheet = new SocialCalc.SpreadsheetControl();

// setup upload tab
   spreadsheet.tabs.splice(spreadsheet.tabnums.audit, 1);

   spreadsheet.tabnums = {};
   for (var i=0; i<spreadsheet.tabs.length; i++) {
      spreadsheet.tabnums[spreadsheet.tabs[i].name] = i;
      }


//Upload
  
 spreadsheet.tabnums.import = spreadsheet.tabs.length;
 spreadsheet.tabs.push({name: "import", text: "Import", html:
     '<div  id="%id.importtools" style="display:none;">'+
     '<form id = "uploadfile" action = "/import" method = "post" enctype = "multipart/form-data" onsubmit="return uploadcheck()" name = "uploadfile">'+
      '<table cellspacing="0" cellpadding="0" style="background-color:#FFF;"><tr><td>'+
      '    <input type="file" id="fileUpload" name ="upload" >'+
      '   </td>'+ 
      '   <td style="vertical-align:top;padding-right:6px;">'+
      '    <input type="submit" value = "Import">'+    
      '    <input type="text" id = "ext" name = "ext" readonly="readonly" style="display:none;">'+ 
      '</td></tr></table></form></div>',
      onclickFocus: true
      });
   //spreadsheet.views["upload"] = {name: "upload", divStyle: "border:1px solid black;overflow:auto;", values: {},
   //   html: 'Upload View'
   //   };
 spreadsheet.tabnums.getticker = spreadsheet.tabs.length;
 spreadsheet.tabs.push({name: "ticker", text: "LoadTickerData", html:
     '<div  id="%id.tickertools" style="display:none">'+
     '<form id = "tickerload" action = "/getticker" method = "post" onsubmit="return tickercheck()">'+
      '<table cellspacing="0" cellpadding="0"><tr><td>'+
      '<input type="text" id = "tickerentry">'+
      '   </td>'+ 
      '   <td style="vertical-align:top;padding-right:6px;">'+
      '    <input type="submit" value = "LoadTicker">'+    
      '</td></tr></table></form></div>',
      onclickFocus: true
      });

function uploadcheck(){
  var file = document.getElementById('fileUpload').value;
  if(file == "")
   { alert("You must select a file to upload");
     return false;
   }
  return true;
}

function tickercheck(){
  var ticker = document.getElementById('tickerentry').value;

  //alert(ticker);

  if (ticker == '') { alert('empty ticker'); return false;}

  var message = {}
  message.ticker = ticker

  //alert(message.ticker)

			
  $.postJSON("/ticker", message, function(response) {
   msg = response["data"]
   //alert(msg)
   insertTickerIntoWorkbook(msg)
});


  return false;
}



var workbook = new SocialCalc.WorkBook(spreadsheet);
workbook.InitializeWorkBook("sheet1");

spreadsheet.InitializeSpreadsheetControl("tableeditor");
spreadsheet.ExecuteCommand('redisplay', '');


var workbookcontrol = new SocialCalc.WorkBookControl(workbook,"workbookControl","sheet1");
workbookcontrol.InitializeWorkBookControl();

SocialCalc.WorkBookControlLoad(document.getElementById("sheetdata").value)

spreadsheet.DoOnResize()


function insertTickerIntoWorkbook(msg) {
  // load the 3 sheets into the workbook
  var control = SocialCalc.GetCurrentWorkBookControl();
  SocialCalc.WorkBookControlInsertWorkbook(msg);
  alert("Load Ticker Done")
}


</script>
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.3/jquery.min.js" type="text/javascript"></script>
<script src="{{ static_url("json2.js") }}" type="text/javascript"></script>
<script>
jQuery.postJSON = function(url, args, callback) {
    
    $.ajax({url: url, data: $.param(args), dataType: "text", type: "POST",
            success: function(response) {
        if (callback) callback(eval("(" + response + ")"));
    }, error: function(response) {
        //console.log("ERROR:", response)
    }});
};

</script>
</body>
</html>
