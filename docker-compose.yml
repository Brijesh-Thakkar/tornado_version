services:

  # ── Shared memcache (session store shared across both app instances) ───────
  memcache:
    image: memcached:1.6-alpine
    networks:
      - app_network
    expose:
      - "11211"
    restart: unless-stopped

  # ── Local S3-compatible storage (MinIO) — used for local dev and CI ────────
  # Production deployments: remove this service and set real AWS credentials in .env
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    networks:
      - app_network
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── One-shot init: creates required S3 buckets inside MinIO ───────────────
  createbuckets:
    image: minio/mc:latest
    networks:
      - app_network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mc2-app-storage-useast1 &&
      mc mb --ignore-existing local/aspiring-pdf-files &&
      exit 0
      "

  # ── Tornado application instance 1 ───────────────────────────────────────
  app1:
    build: .
    expose:
      - "8888"
    networks:
      - app_network
    env_file:
      - .env
    environment:
      - MEMCACHE_HOST=memcache
      - MESHKIT_SIDECAR_URL=http://meshkit-sidecar:5050
    depends_on:
      memcache:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
      meshkit-sidecar:
        condition: service_started
    restart: unless-stopped

  # ── Tornado application instance 2 ───────────────────────────────────────
  app2:
    build: .
    expose:
      - "8888"
    networks:
      - app_network
    env_file:
      - .env
    environment:
      - MEMCACHE_HOST=memcache
      - MESHKIT_SIDECAR_URL=http://meshkit-sidecar:5050
    depends_on:
      memcache:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
      meshkit-sidecar:
        condition: service_started
    restart: unless-stopped

  # ── MeshKit IPFS sidecar (REST gateway for SocialCalc save/load) ─────────
  meshkit-sidecar:
    build: ./meshkit-sidecar
    expose:
      - "5050"
    env_file: ./meshkit-sidecar/.env
    networks:
      - app_network
    restart: unless-stopped

  # ── MeshKit IPFS proxy ────────────────────────────────────────────────────
  meshkit-service:
    build: ./meshkit-service
    expose:
      - "4000"
    env_file: ./meshkit-service/.env
    environment:
      - PORT=4000
    networks:
      - app_network
    restart: unless-stopped

  # ── Nginx reverse proxy (only service that binds a host port) ─────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    networks:
      - app_network
    volumes:
      - ./configs/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  minio_data:
