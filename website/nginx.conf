
worker_processes  1;

error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
}

http {

    upstream aspiringapp_server_com {
      server 127.0.0.1:8000 weight=5;
      server 127.0.0.1:8001 weight=5;
      server 127.0.0.1:8002 weight=5;
      server 127.0.0.1:8003 weight=5;
    }


    upstream amazonwebapp_server_com {
      server 127.0.0.1:9000 weight=5;
      server 127.0.0.1:9001 weight=5;
      server 127.0.0.1:9002 weight=5;
      server 127.0.0.1:9003 weight=5;
    }

    upstream aspiringwebsite_server_com {
      server 127.0.0.1:10000 weight=5;
      server 127.0.0.1:10001 weight=5;
      server 127.0.0.1:10002 weight=5;
      server 127.0.0.1:10003 weight=5;
    }
    upstream aspiringsubscribe_server_com {
      server 127.0.0.1:11000 weight=5;
      server 127.0.0.1:11001 weight=5;
      server 127.0.0.1:11002 weight=5;
      server 127.0.0.1:11003 weight=5;
    }

    upstream angularportal_server_com {
      server 127.0.0.1:12000 weight=5;
      server 127.0.0.1:12001 weight=5;
      server 127.0.0.1:12002 weight=5;
      server 127.0.0.1:12003 weight=5;
    }

    upstream syncwebapp_server_com {
      server 127.0.0.1:13000 weight=5;
      server 127.0.0.1:13001 weight=5;
      server 127.0.0.1:13002 weight=5;
      server 127.0.0.1:13003 weight=5;
    }

    upstream cloudmain_ionic_2 {
      server 127.0.0.1:14000 weight=5;
      server 127.0.0.1:14001 weight=5;
      server 127.0.0.1:14002 weight=5;
      server 127.0.0.1:14003 weight=5;
    }

    upstream subscribe_ionic_2 {
      server 127.0.0.1:16000 weight=5;
      server 127.0.0.1:16001 weight=5;
      server 127.0.0.1:16002 weight=5;
      server 127.0.0.1:16003 weight=5;
    }

    upstream finance_apps_server {
      server 127.0.0.1:15000 weight=5;
      server 127.0.0.1:15001 weight=5;
      server 127.0.0.1:15002 weight=5;
      server 127.0.0.1:15003 weight=5;
    }

    upstream firebase_website {
      server 127.0.0.1:17000 weight=5;
      server 127.0.0.1:17001 weight=5;
      server 127.0.0.1:17002 weight=5;
      server 127.0.0.1:17003 weight=5;
    }

    upstream ecommerce_model {
      server 127.0.0.1:18000 weight=5;
      server 127.0.0.1:18001 weight=5;
      server 127.0.0.1:18002 weight=5;
      server 127.0.0.1:18003 weight=5;
    }


    upstream php {
       server 127.0.0.1:9500;
    }

    include       mime.types;
    default_type  application/octet-stream;

    access_log	/var/log/nginx/access.log;

    keepalive_timeout 65;
    #proxy_read_timeout 200;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/html text/css application/x-javascript application/xml application/atom+xml text/javascript;

    # Only retry if there was a communication error, not a timeout
    # on the Tornado server (to avoid propagating "queries of death"
    # to all frontends)
    proxy_next_upstream error;

    #include /etc/nginx/sites-enabled/default;

