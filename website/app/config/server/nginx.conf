
worker_processes  1;

error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
}

http {

    upstream aspiringapp_server_com {
      server 127.0.0.1:8000 weight=5;
      server 127.0.0.1:8001 weight=5;
      server 127.0.0.1:8002 weight=5;
      server 127.0.0.1:8003 weight=5;
    }


    upstream amazonwebapp_server_com {
      server 127.0.0.1:9000 weight=5;
      server 127.0.0.1:9001 weight=5;
      server 127.0.0.1:9002 weight=5;
      server 127.0.0.1:9003 weight=5;
    }

    upstream aspiringwebsite_server_com {
      server 127.0.0.1:10000 weight=5;
      server 127.0.0.1:10001 weight=5;
      server 127.0.0.1:10002 weight=5;
      server 127.0.0.1:10003 weight=5;
    }


    upstream php {
       server 127.0.0.1:9500;
    }

    include       mime.types;
    default_type  application/octet-stream;

    access_log	/var/log/nginx/access.log;

    keepalive_timeout 65;
    #proxy_read_timeout 200;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/html text/css application/x-javascript application/xml application/atom+xml text/javascript;

    # Only retry if there was a communication error, not a timeout
    # on the Tornado server (to avoid propagating "queries of death"
    # to all frontends)
    proxy_next_upstream error;

    #include /etc/nginx/sites-enabled/default;

   server {
	listen   80;


	pagespeed on;

	#pagespeed Statistics on;
	#pagespeed StatisticsLogging on;
	#pagespeed LogDir /var/log/pagespeed;

	# Needs 	to exist and be writable by nginx.  Use tmpfs for best performance.
	pagespeed FileCachePath /var/ngx_pagespeed_cache;

	root /var/www/wordpress;
	index index.php;

	# Allow file uploads
        client_max_body_size 50M;

        location @dev {
	    proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
           proxy_pass  http://aspiringapp_server_com;
           
        }
        location @aspiringwebsite {
	    proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
           proxy_pass  http://aspiringwebsite_server_com;
           
        }

        location /amazonwebapp {
	    proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
           proxy_pass  http://amazonwebapp_server_com;
           
        }	
	# the following will pull up the wordpress site
	#location / {
        #        try_files $uri $uri/ /index.php?$args;
        #}

	# the following will serve out the static website
	location / {
		root /home/ubuntu/apps/3-0-0-launch/src/website_tickervalue/sitev2;
                try_files $uri $uri/index.html;
        }

        # the following locations are for the aspiring website in development
	location /web/home {
	   try_files $uri @aspiringwebsite;
	}	
	location /web/login {
	   try_files $uri @aspiringwebsite;
	}	
	location /web/lostpw {
	   try_files $uri @aspiringwebsite;
	}	
	location /web/signup {
	   try_files $uri @aspiringwebsite;
	}	



        # the following locations are for cloudmain.py
	location /dev {
	   try_files $uri @dev;
	}	
	location /save {
	   try_files $uri @dev;
	}	
	location /runas {
	   try_files $uri @dev;
	}	
	location /runasemailer {
	   try_files $uri @dev;
	}	
	location /usersheet {
	   try_files $uri @dev;
	}	
	location /insert {
	   try_files $uri @dev;
	}	
	location /import {
	   try_files $uri @dev;
	}	
	location /downloadfile {
	   try_files $uri @dev;
	}	
	location /htmltopdf {
	   try_files $uri @dev;
	}	
	location /login {
	   try_files $uri @dev;
	}	
	location /logout {
	   try_files $uri @dev;
	}	
	location /register {
	   try_files $uri @dev;
	}	
	location /lostpw {
	   try_files $uri @dev;
	}	
	location /webapp {
	   try_files $uri @dev;
	}	
	location /pwreset {
	   try_files $uri @dev;
	}	
	location /static {
	   try_files $uri @dev;
	}	


	# the following is for wordpress
	#	location ~ \.php$ {
        #        #NOTE: You should have "cgi.fix_pathinfo = 0;" in php.ini
        #        include fastcgi.conf;
	#	#fastcgi_split_path_info ^(/wordpress)(/.*)$;
        #        fastcgi_intercept_errors on;
