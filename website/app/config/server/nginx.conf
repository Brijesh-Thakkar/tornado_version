        #
        #}
   }

   server {
	listen   443 ssl;

	pagespeed on;

	#pagespeed Statistics on;
	#pagespeed StatisticsLogging on;
	#pagespeed LogDir /var/log/pagespeed;

	# Needs 	to exist and be writable by nginx.  Use tmpfs for best performance.
	pagespeed FileCachePath /var/ngx_pagespeed_cache;

	pagespeed EnableFilters combine_javascript;
	pagespeed LoadFromFile "https://aspiringapps.com/static/" "/home/ubuntu/apps/3-0-0-launch/src/static/";


	# Allow file uploads
        client_max_body_size 50M;

	#	ssl on;
	ssl_certificate /etc/nginx/ssl/namecheap/aspiringapps.com.chained.crt;
	ssl_certificate_key /etc/nginx/ssl/namecheap/server.key.nopass;


